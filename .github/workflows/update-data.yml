name: Update PvP rank data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_data.py"
      - ".github/workflows/update-data.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: lrpvprank-rangerbook-sync
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync rangerbook PvP usage
        run: python scripts/update_data.py

      - name: Commit data when rangerbook changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Sync PvP rank data from rangerbook"
          file_pattern: data/latest.json
